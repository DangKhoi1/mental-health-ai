services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mental_health_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── AI Service (FastAPI / Python) ────────────────────────────────────────────
  ai-service:
    build:
      context: ./mental-health-ai-service
      dockerfile: Dockerfile
    container_name: mental_health_ai_service
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      APP_ENV: ${APP_ENV:-production}
      PORT: "5001"
      WORKERS: ${WORKERS:-2}
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/health 2>/dev/null || curl -f http://localhost:5001/docs 2>/dev/null || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Backend (NestJS) ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./mental-health-ai-backend
      dockerfile: Dockerfile
    container_name: mental_health_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      # Auth
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # AI Service
      AI_SERVICE_URL: http://ai-service:5001
      AI_RECOMMENDATION_CRON: ${AI_RECOMMENDATION_CRON:-0 0 * * *}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-120000}
      AI_HEALTH_TIMEOUT_MS: ${AI_HEALTH_TIMEOUT_MS:-10000}
      # Cloudinary
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      # CORS
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      NODE_ENV: production
    volumes:
      - uploads_data:/app/uploads
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1 2>/dev/null || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Frontend (Next.js) ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./mental-health-ai-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: mental_health_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - internal

  # ── Admin Panel (Next.js) ─────────────────────────────────────────────────────
  admin:
    build:
      context: ./mental-health-ai-admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: mental_health_admin
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - internal

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: mental_health_nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - admin
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - internal
      - external

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  internal:
    driver: bridge
  external:
    driver: bridge
